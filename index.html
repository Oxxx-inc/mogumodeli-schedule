<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>モグモデリ 包材スケジュール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow:wght@500;600;700&display=swap">
<style>
/* 刷版の工程表：CMYK の3色で「デザイン／版下・校正／印刷・加工」を塗り分けた、締切だけの一覧 */
:root {
  --bg: #f3f4f2;
  --paper: #ffffff;
  --ink: #1b1f22;
  --num: #000000;   /* 日付の数字。いちばん目立たせたいので純黒 */
  --title: #4b5155; /* 見出しは日付より一段引かせる */
  --mute: #666e73;
  --rule: #d9dcd8;
  --k: #3f4549;   /* 墨＝商品情報 */
  --k-soft: #e6e8e7;
  --c: #0095c8;   /* シアン＝デザイン〜入稿 */
  --m: #d6246e;   /* マゼンタ＝版下〜校了 */
  --y: #c99700;   /* イエロー＝印刷・加工 */
  --c-soft: #e2f3fa;
  --m-soft: #fbe5ee;
  --y-soft: #fdf3d4;
  --warn: #c2410c;
  --warn-soft: #fff1e6;
  --ok: #15803d;
  --font: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  /* 数字は DIN。Mac・iPhone は本体の DIN Alternate、それ以外は形の近い Barlow で出す */
  --mono: "DIN Alternate", "DIN 2014", "DIN Next LT Pro", "D-DIN", "Barlow", "Zen Kaku Gothic New", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171a; --paper: #1d2125; --ink: #e9ecea; --num: #ffffff; --title: #b4bbbf; --mute: #9aa3a8; --rule: #33393e;
    --k: #c7cdd0; --k-soft: #2a2f33; --c: #3cbde8; --m: #f0598f; --y: #f2c230;
    --c-soft: #15303b; --m-soft: #3a1a27; --y-soft: #3a3115;
    --warn: #fb923c; --warn-soft: #3a2314; --ok: #4ade80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171a; --paper: #1d2125; --ink: #e9ecea; --num: #ffffff; --title: #b4bbbf; --mute: #9aa3a8; --rule: #33393e;
  --k: #c7cdd0; --k-soft: #2a2f33; --c: #3cbde8; --m: #f0598f; --y: #f2c230;
  --c-soft: #15303b; --m-soft: #3a1a27; --y-soft: #3a3115;
  --warn: #fb923c; --warn-soft: #3a2314; --ok: #4ade80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
.list { display: grid; gap: 16px; min-width: 0; }

/* 見出し：トンボと色玉 */
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { margin: 0; color: var(--title); font-size: clamp(20px, 3.6vw, 26px); font-weight: 700; letter-spacing: .02em; text-wrap: balance; }

.panel { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 20px; min-width: 0; }

/* 入力 */
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 20px; align-items: start; }
.field { display: grid; gap: 6px; min-width: 0; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--mute); }
.seg { display: flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg label { flex: 1; text-align: center; padding: 9px 8px; cursor: pointer; font-size: 14px; font-weight: 500; position: relative; }
.seg label + label { border-left: 1px solid var(--rule); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--ink); color: var(--paper); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--c); outline-offset: -3px; }
.seg small { display: block; font-size: 11px; opacity: .75; font-weight: 400; }
input[type="date"] {
  font: 600 16px var(--mono); color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; width: 100%;
}
input[type="date"]:focus-visible { outline: 2px solid var(--c); outline-offset: 1px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--ink); }

.alerts { display: grid; gap: 10px; }
.alert { padding: 12px 16px; border-radius: 6px; font-size: 14px; background: var(--warn-soft); color: var(--warn); display: grid; gap: 2px; }
.alert b { font-size: 15px; }

/* 締切の一覧 */
.section { display: grid; min-width: 0; }
.sec-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--ps); border-left: 6px solid var(--pc); border-radius: 6px 6px 0 0;
}
.sec-head h2 { margin: 0; color: var(--title); font-size: 15px; font-weight: 700; }
.sec-head h2 span { color: var(--pc); font-size: 12px; letter-spacing: .08em; margin-right: 8px; }
/* セクションの締切：色の帯の上に白い枠を置いて、見出しの中で目に入るようにする */
.sec-head .sd {
  display: inline-flex; align-items: center; gap: 8px; font-size: 12px;
  background: var(--paper); border: 1px solid var(--pc); border-radius: 4px; padding: 3px 10px 3px 4px;
}
.sec-head .sd span { background: var(--pc); color: var(--paper); font-weight: 700; padding: 1px 8px; border-radius: 3px; letter-spacing: .08em; }
.sec-head .sd b { font-family: var(--mono); color: var(--num); font-size: 16px; font-weight: 700; }

.steps { list-style: none; margin: 0; padding: 0; background: var(--paper); border: 1px solid var(--rule); border-top: 0; border-radius: 0 0 6px 6px; }
.step { display: grid; grid-template-columns: 92px 1fr auto; gap: 4px 16px; padding: 16px; border-top: 1px solid var(--rule); align-items: start; }
.steps > li:first-child { border-top: 0; }
/* 日付はセクションの色を薄く敷いた札にして、一覧の中でいちばん先に目に入るようにする */
.step { grid-template-columns: 112px 1fr; }
.date {
  font-family: var(--mono); font-variant-numeric: tabular-nums; line-height: 1.15;
  background: var(--ps); border-radius: 6px; padding: 10px 8px; text-align: center;
}
.date .md { font-size: 32px; font-weight: 700; color: var(--num); }
.date .md.range { font-size: 21px; }
.date .wd { font-family: var(--font); font-size: 13px; font-weight: 700; color: var(--pc); margin-top: 4px; }
.step.past .date { background: var(--bg); }
.step.final .date { box-shadow: inset 0 0 0 2px var(--pc); }
.date .wd.we { color: var(--warn); }
.body { min-width: 0; }
.body h3 { margin: 0; color: var(--title); font-size: 15px; font-weight: 700; }
.body p { margin: 4px 0 0; font-size: 13px; color: var(--mute); }
.body .gap { margin-top: 6px; font-size: 12px; color: var(--mute); display: flex; gap: 4px 12px; flex-wrap: wrap; }
.body .gap .shift { color: var(--warn); }
.step.past .date .md, .step.past .date .wd, .step.past h3 { color: var(--mute); }
.today {
  display: flex; align-items: center; gap: 10px; padding: 6px 16px; font-size: 12px; font-weight: 700; color: var(--warn);
  border-top: 1px solid var(--rule); background: var(--warn-soft);
}
.today::after { content: ""; flex: 1; border-top: 2px dashed var(--warn); }

/* 表示の切り替え（一覧／カレンダー） */
.view-seg { max-width: 280px; }

/* カレンダー：締切の日だけにセクションの色の札を置き、数字はほかと同じく黒の DIN */
.cal { display: grid; gap: 16px; }
.month { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 14px; min-width: 0; }
.month h2 { margin: 0 0 10px; color: var(--title); font-size: 15px; font-weight: 700; }
.month h2 b { font-family: var(--mono); color: var(--num); font-size: 20px; margin-right: 2px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); }
.cal-grid .dow { font-size: 11px; font-weight: 700; color: var(--mute); text-align: center; padding: 4px 0; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: var(--bg); }
.cal-grid .dow.su, .cal-grid .dow.sa { color: var(--warn); }
.day { min-height: 84px; padding: 4px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.day.out { background: var(--bg); }
.day.we { background: color-mix(in srgb, var(--bg) 60%, var(--paper)); }
.day .n { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--num); line-height: 1.2; }
.day.out .n { visibility: hidden; }
.day.we .n { color: var(--mute); }
.day.today { box-shadow: inset 0 0 0 2px var(--warn); }
.day.today .n::after { content: "今日"; font-family: var(--font); font-size: 10px; color: var(--warn); margin-left: 4px; }
.ev {
  font-size: 11px; font-weight: 700; line-height: 1.3; color: var(--ink);
  background: var(--ps); border-left: 3px solid var(--pc); border-radius: 3px; padding: 2px 4px;
  overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
}
.ev.cont { color: transparent; height: 8px; padding: 0; }
.ev.final { box-shadow: inset 0 0 0 1.5px var(--pc); }
.day.past .ev { opacity: .55; }
.cal-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--mute); }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
.cal-legend i { width: 12px; height: 12px; border-radius: 2px; background: var(--ps); border-left: 3px solid var(--pc); }


/* 商品名と保存。保存した商品は下に並べ、押すとその商品の日付を読みこむ */
.name-row { display: flex; gap: 8px; }
input[type="text"] {
  flex: 1; min-width: 0; font: 500 16px var(--font); color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px;
}
input[type="text"]:focus-visible { outline: 2px solid var(--c); outline-offset: 1px; }
button {
  font: 700 14px var(--font); color: var(--paper); background: var(--ink); border: 0; border-radius: 6px;
  padding: 8px 16px; cursor: pointer; white-space: nowrap;
}
button:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
.saved-msg { font-size: 12px; color: var(--ok); }
.form .full { grid-column: 1 / -1; }
.history h2 { margin: 0 0 8px; color: var(--title); font-size: 14px; font-weight: 700; }
.history ul { list-style: none; margin: 0; padding: 0; }
.history li { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--rule); }
.history li:first-child { border-top: 0; }
.history .open {
  flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; text-align: left;
  background: none; color: var(--ink); padding: 10px 4px; border-radius: 4px; font-weight: 500;
}
.history .open:hover { background: var(--bg); }
.history li.cur .open { background: var(--c-soft); }
.history .open b { font-size: 15px; font-weight: 700; }
.history .open span { font-size: 12px; color: var(--mute); }
.history .open span i { font-style: normal; font-family: var(--mono); color: var(--num); font-weight: 700; font-size: 13px; }
.history .del { background: none; color: var(--mute); font-weight: 500; font-size: 12px; padding: 6px 8px; }
.history .del:hover { color: var(--warn); }
.history .empty { font-size: 13px; color: var(--mute); margin: 0; }

footer { font-size: 12px; color: var(--mute); }

@media (max-width: 560px) {
  .month { padding: 10px 8px; }
  .day { min-height: 64px; padding: 2px; }
  .day .n { font-size: 13px; }
  .ev { font-size: 9.5px; padding: 1px 2px; border-left-width: 2px; }
  .day.today .n::after { display: none; }
  .form { grid-template-columns: 1fr; }
  .step { grid-template-columns: 86px 1fr; }
  .date .md { font-size: 26px; }
  .date .md.range { font-size: 17px; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>モグモデリ 包材スケジュール</h1>
  </header>

  <section class="panel">
    <div class="form">
      <div class="field full">
        <label class="label" for="pname">商品名</label>
        <div class="name-row">
          <input type="text" id="pname" placeholder="例：白身魚フライ" autocomplete="off">
          <button type="button" id="save">保存</button>
        </div>
        <span class="saved-msg" id="savedMsg" hidden></span>
      </div>
      <div class="field">
        <span class="label">どちらから決める</span>
        <div class="seg" role="radiogroup" aria-label="計算のしかた">
          <label><input type="radio" name="mode" id="modeBack" value="back" checked>納品日<small>から逆算</small></label>
          <label><input type="radio" name="mode" id="modeFwd" value="fwd">商品情報の確定日<small>から順算</small></label>
        </div>
      </div>
      <div class="field">
        <label class="label" for="base" id="baseLabel">包材納品日</label>
        <input type="date" id="base">
        <label class="check"><input type="checkbox" id="shift" checked>土日に当たる締切は、前の金曜に前倒しする</label>
      </div>
    </div>
  </section>

  <section class="panel history">
    <h2>保存した商品</h2>
    <ul id="history"></ul>
    <p class="empty" id="historyEmpty">まだありません。商品名を入れて「保存」を押すと、ここに残ります。</p>
  </section>

  <div id="alert" class="alerts" aria-live="polite" hidden></div>

  <div class="seg view-seg" role="radiogroup" aria-label="表示">
    <label><input type="radio" name="view" id="viewList" value="list" checked>一覧</label>
    <label><input type="radio" name="view" id="viewCal" value="cal">カレンダー</label>
  </div>

  <div id="list" class="list"></div>
  <div id="cal" class="cal" hidden></div>


  <footer>
    日数は「白身魚フライ」の実績（入稿 9.3 → 納品 10.30）の間隔をそのまま当てはめたものです。商品情報の確定から入稿までは、裏面と商品名の差し替えに3営業日を見ています。祝日・お盆・年末年始は見ていないので、その時期にかかる場合は余裕を足してください。
  </footer>
</div>

<script>
const PHASES = {
  k: { name: '商品情報の確定', color: '--k', soft: '--k-soft' },
  c: { name: '差し替え〜入稿・色見本', color: '--c', soft: '--c-soft' },
  m: { name: '版下〜色校正・校了', color: '--m', soft: '--m-soft' },
  y: { name: '印刷・加工・納品', color: '--y', soft: '--y-soft' },
};
// 白身魚フライの実績の日付を「納品日から何日前か」に直したもの（9/3〜10/30 の57日）
const TOTAL = 57;
// 商品情報が確定してから、裏面と商品名を差し替えて入稿できるまでの営業日
const SWAP_BD = 3;
const STEPS = [
  { name: 'デザインデータ作成（先行）', key: 'design', short: 'デザイン先行', ph: 'k',
    note: '商品情報を待たずに先に作っておく。確定したら、このデータに裏面と商品名を流しこむ。' },
  { name: '商品情報の確定', key: 'fix', short: '商品情報 確定', ph: 'k',
    note: '商品名・原材料・栄養成分・アレルゲンなど、裏面に載せる内容をすべて確定する。' },
  { name: '裏面・商品名の差し替え', key: 'swap', short: '裏面・商品名 差し替え', ph: 'c',
    note: `確定した商品情報を、先に作ったデザインデータに入れる（${SWAP_BD}営業日）。` },
  { name: '入稿データ作成・提出、色見本手配', at: -57, key: 'submit', short: '入稿・色見本', ph: 'c',
    note: 'カラー指定（DIC等）を確定して入稿データを提出。色見本を手配・発送する。' },
  { name: '版下提出', at: -49, short: '版下提出', ph: 'm',
    note: 'メーカーが入稿データから版下を起こして提出。文字・レイアウト・表示内容を確認する。' },
  { name: '色校正出稿（到着）', at: -31, short: '色校正 到着', ph: 'm',
    note: '色校正が届く。色見本と見比べて、色味の調整を指示する。' },
  { name: '校了', at: -25, short: '校了', ph: 'm',
    note: '色味の調整を終えて最終確認。ここから先は修正できない。' },
  { name: '校正刷り確認', at: -17, short: '校正刷り確認', ph: 'y',
    note: '本機での校正刷りを確認する。' },
  { name: '印刷', at: -10, short: '印刷', ph: 'y',
    note: '本印刷。' },
  { name: '加工（ラミネート・スリット）', from: -8, at: -4, short: 'ラミ・スリット加工', ph: 'y',
    note: 'ラミネート加工とスリット加工。' },
  { name: '包材納品完了', at: 0, short: '包材納品', ph: 'y', final: true,
    note: '包材が納品される。' },
];

// 日付は「1970-01-01 からの日数」の整数で持つ。Date のまま足し引きすると
// タイムゾーンや夏時間で1日ずれることがあるため。
const DAY = 86400000;
const toDay = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAY); };
const fromDay = n => new Date(n * DAY);
const iso = n => fromDay(n).toISOString().slice(0, 10);
const WD = '日月火水木金土';
const wd = n => fromDay(n).getUTCDay();
const isWe = n => wd(n) === 0 || wd(n) === 6;
const fmt = n => { const d = fromDay(n); return `${d.getUTCFullYear()}.${d.getUTCMonth() + 1}.${d.getUTCDate()}`; };
const fmtS = n => { const d = fromDay(n); return `${d.getUTCMonth() + 1}.${d.getUTCDate()}`; };
const withWd = n => `${fmt(n)}（${WD[wd(n)]}）`;
const now = new Date();
const today = Math.round(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / DAY);

// 締切が土日なら前の金曜へ。後ろにずらすと後工程の日数が削られるので、前倒しにする。
const backToWeekday = n => { const w = wd(n); return w === 6 ? n - 1 : w === 0 ? n - 2 : n; };
// 営業日（土日を除く）で k 日進める・戻す
const addBD = (n, k) => { const step = k < 0 ? -1 : 1; for (let i = Math.abs(k); i > 0;) { n += step; if (!isWe(n)) i--; } return n; };

const $ = id => document.getElementById(id);
const els = { base: $('base'), shift: $('shift'), baseLabel: $('baseLabel') };

// 開いたときは、今日から約3ヶ月後の金曜を納品日にした例を出しておく
els.base.value = iso(backToWeekday(today + 90));

const val = name => document.querySelector(`input[name="${name}"]:checked`).value;
let lastPlan = null;

function compute() {
  if (!els.base.value) return null;
  const mode = val('mode');
  const base = toDay(els.base.value);
  const fix = n => (els.shift.checked ? backToWeekday(n) : n);
  // 逆算は納品日から入稿日を出し、その3営業日前を商品情報の確定日にする。
  // 順算は確定日（入力）から3営業日で入稿し、そこから実績の57日で納品する。
  let end, submit, fixDay;
  if (mode === 'back') {
    end = base;
    submit = fix(end - TOTAL);
    fixDay = addBD(submit, -SWAP_BD);
  } else {
    fixDay = base;
    submit = addBD(fixDay, SWAP_BD);
    end = submit + TOTAL;
  }
  const steps = STEPS.map(s => {
    if (s.key === 'design') return { ...s, due: fixDay, from: null, shifted: false };
    if (s.key === 'fix') return { ...s, due: fixDay, from: null, shifted: false };
    if (s.key === 'swap') return { ...s, due: submit, from: addBD(fixDay, 1), shifted: false };
    if (s.key === 'submit') return { ...s, due: submit, from: null, shifted: submit !== end + s.at };
    // 納品日（逆算）は入力そのものなので動かさない
    const raw = end + s.at;
    const due = (mode === 'back' && s.final) ? raw : fix(raw);
    const from = s.from != null ? fix(end + s.from) : null;
    return { ...s, due, from, shifted: due !== raw };
  });
  return { mode, end, start: fixDay, submit, steps };
}

function render() {
  const r = compute();
  if (!r) return;
  const { mode, end, start, submit, steps } = r;
  els.baseLabel.textContent = mode === 'back' ? '包材納品日' : '商品情報の確定日';

  const alerts = [];
  if (start < today) {
    const next = steps.find(s => s.due >= today);
    alerts.push(`<div class="alert"><b>この納品日だと間に合いません</b><span>商品情報の確定の締切 ${withWd(start)} を${today - start}日過ぎています。${next ? `今ごろ「${next.name}」の手前まで進んでいる必要があります。` : ''}今日商品情報が確定した場合の最短の納品日は ${withWd(addBD(today, SWAP_BD) + TOTAL)} です。</span></div>`);
  }
  if (isWe(end)) {
    alerts.push(`<div class="alert"><b>納品日が${WD[wd(end)]}曜日です</b><span>受け取れるか確認してください。</span></div>`);
  }
  $('alert').innerHTML = alerts.join('');
  $('alert').hidden = !alerts.length;

  const nextIdx = steps.findIndex(s => s.due >= today);
  $('list').innerHTML = Object.entries(PHASES).map(([k, ph], i) => {
    const list = steps.filter(s => s.ph === k);
    const due = Math.max(...list.map(s => s.due));
    const items = list.map(s => {
      const idx = steps.indexOf(s);
      // 今日の位置に線を引く（最初の工程より前なら出さない）
      const line = idx === nextIdx && idx > 0 ? `<li class="today">今日 ${fmtS(today)}（${WD[wd(today)]}）</li>` : '';
      const md = s.from != null
        ? `<div class="md range">${fmtS(s.from)}〜<br>${fmtS(s.due)}</div><div class="wd${isWe(s.from) || isWe(s.due) ? ' we' : ''}">${WD[wd(s.from)]}〜${WD[wd(s.due)]}</div>`
        : `<div class="md">${fmtS(s.due)}</div><div class="wd${isWe(s.due) ? ' we' : ''}">${WD[wd(s.due)]}曜日</div>`;
      const gaps = [];
      if (s.key === 'design') gaps.push('商品情報の確定までに');
      else if (s.key === 'swap') gaps.push(`作業 ${SWAP_BD}営業日`);
      else if (s.from != null) gaps.push(`作業 ${s.due - s.from + 1}日間`);
      if (s.shifted) gaps.push('<span class="shift">土日のため前倒し</span>');
      return `${line}<li class="step${s.due < today ? ' past' : ''}${s.final ? ' final' : ''}">
        <div class="date">${md}</div>
        <div class="body">
          <h3>${s.name}</h3>
          <p>${s.note}</p>
          ${gaps.length ? `<div class="gap">${gaps.map(g => `<span>${g}</span>`).join('')}</div>` : ''}
        </div>
      </li>`;
    }).join('');
    return `<section class="section" style="--pc:var(${ph.color});--ps:var(${ph.soft})">
      <div class="sec-head">
        <h2><span>セクション ${i + 1}</span>${ph.name}</h2>
        <div class="sd"><span>締切</span><b>${withWd(due)}</b></div>
      </div>
      <ol class="steps">${items}</ol>
    </section>`;
  }).join('');


  renderCal(steps, start, end);
  lastPlan = { start, submit, end };
}

document.querySelectorAll('input').forEach(i => {
  i.addEventListener('input', render);
  i.addEventListener('change', render);
});




// 保存した商品。サーバーが無いので、この端末のブラウザにだけ残る（localStorage）。
// 同じ商品名で保存し直すと上書きする。
const HKEY = 'mogu_schedule_history';
const loadH = () => { try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) { return []; } };
const saveH = h => { try { localStorage.setItem(HKEY, JSON.stringify(h)); return true; } catch (e) { return false; } };
const esc = t => t.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

function renderHistory() {
  const h = loadH();
  const cur = $('pname').value.trim();
  $('historyEmpty').hidden = h.length > 0;
  $('history').innerHTML = h.map((it, i) => `<li class="${it.name === cur ? 'cur' : ''}">
    <button type="button" class="open" data-i="${i}">
      <b>${esc(it.name)}</b>
      <span>確定 <i>${fmtS(it.start)}</i> → 入稿 <i>${fmtS(it.submit)}</i> → 納品 <i>${fmt(it.end)}</i></span>
    </button>
    <button type="button" class="del" data-i="${i}" aria-label="${esc(it.name)}を削除">削除</button>
  </li>`).join('');
}

function flash(msg) {
  const m = $('savedMsg');
  m.textContent = msg; m.hidden = false;
  clearTimeout(flash.t); flash.t = setTimeout(() => (m.hidden = true), 1800);
}

$('save').addEventListener('click', () => {
  const name = $('pname').value.trim();
  if (!name) { $('pname').focus(); flash('商品名を入れてください'); return; }
  if (!lastPlan) return;
  const item = { name, mode: val('mode'), base: els.base.value, shift: els.shift.checked, ...lastPlan, at: Date.now() };
  const h = loadH().filter(it => it.name !== name);
  h.unshift(item);
  flash(saveH(h) ? `「${name}」を保存しました` : 'このブラウザでは保存できませんでした');
  renderHistory();
});

$('history').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const h = loadH();
  const it = h[+b.dataset.i];
  if (!it) return;
  if (b.classList.contains('del')) {
    if (!confirm(`「${it.name}」を履歴から削除しますか？`)) return;
    h.splice(+b.dataset.i, 1);
    saveH(h);
  } else {
    $('pname').value = it.name;
    (it.mode === 'fwd' ? $('modeFwd') : $('modeBack')).checked = true;
    els.base.value = it.base;
    els.shift.checked = it.shift;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  renderHistory();
});
$('pname').addEventListener('input', renderHistory);

// カレンダー：入稿の月から納品の月までを、日曜はじまりの月ごとのマスで並べる
function renderCal(steps, start, end) {
  const byDay = {};
  const put = (n, ev) => (byDay[n] = byDay[n] || []).push(ev);
  steps.forEach(s => {
    if (s.from != null) {
      for (let n = s.from; n <= s.due; n++) put(n, { s, cont: n !== s.from });
    } else put(s.due, { s });
  });
  const first = fromDay(start), last = fromDay(end);
  let y = first.getUTCFullYear(), m = first.getUTCMonth();
  const months = [];
  while (y < last.getUTCFullYear() || (y === last.getUTCFullYear() && m <= last.getUTCMonth())) {
    const d1 = Math.round(Date.UTC(y, m, 1) / DAY);
    const dN = Math.round(Date.UTC(y, m + 1, 0) / DAY);
    let cells = WD.split('').map((w, i) => `<div class="dow${i === 0 ? ' su' : i === 6 ? ' sa' : ''}">${w}</div>`).join('');
    for (let i = 0; i < wd(d1); i++) cells += '<div class="day out"><span class="n">0</span></div>';
    for (let n = d1; n <= dN; n++) {
      const evs = (byDay[n] || []).map(({ s, cont }) => {
        const ph = PHASES[s.ph];
        const st = `--pc:var(${ph.color});--ps:var(${ph.soft})`;
        return cont
          ? `<div class="ev cont" style="${st}" aria-hidden="true"></div>`
          : `<div class="ev${s.final ? ' final' : ''}" style="${st}" title="${s.name}">${s.short}</div>`;
      }).join('');
      const cls = ['day', isWe(n) ? 'we' : '', n === today ? 'today' : '', n < today ? 'past' : ''].filter(Boolean).join(' ');
      cells += `<div class="${cls}"><span class="n">${n - d1 + 1}</span>${evs}</div>`;
    }
    const tail = (7 - ((wd(d1) + dN - d1 + 1) % 7)) % 7;
    for (let i = 0; i < tail; i++) cells += '<div class="day out"><span class="n">0</span></div>';
    months.push(`<section class="month"><h2><b>${m + 1}</b>月 <span style="font-family:var(--mono);color:var(--mute);font-size:13px">${y}</span></h2><div class="cal-grid">${cells}</div></section>`);
    if (++m > 11) { m = 0; y++; }
  }
  const legend = `<div class="cal-legend">${Object.values(PHASES).map(ph => `<span style="--pc:var(${ph.color});--ps:var(${ph.soft})"><i></i>${ph.name}</span>`).join('')}</div>`;
  $('cal').innerHTML = legend + months.join('');
}

// 表示の切り替え。どちらで見ていたかは、その端末にだけ覚えておく
function applyView() {
  const v = val('view');
  $('list').hidden = v !== 'list';
  $('cal').hidden = v !== 'cal';
  try { localStorage.setItem('mogu_view', v); } catch (e) {}
}
try { if (localStorage.getItem('mogu_view') === 'cal') $('viewCal').checked = true; } catch (e) {}
document.querySelectorAll('input[name="view"]').forEach(i => i.addEventListener('change', applyView));
applyView();

render();
renderHistory();
</script>
